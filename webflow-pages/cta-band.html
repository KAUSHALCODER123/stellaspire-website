<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellaspire CTA band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root {
  --navy: #1d2142;
  --accent: #70b5f0;
  --accent-hover: #8cc4f4;
  --head: #ffffff;
  --body: #cfd3e6;
  --hairline: rgba(211, 211, 211, .18);

  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Montserrat", Arial, "Helvetica Neue", Helvetica, sans-serif;

  --gutter: clamp(24px, 5vw, 80px);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: #ffffff;
  font-family: var(--sans);
}

.brief {
  background: var(--navy);
  padding: clamp(72px, 10vw, 150px) var(--gutter);
}

.brief__grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  column-gap: clamp(16px, 2vw, 32px);
  width: min(100%, 1240px);
  margin-inline: auto;
}

.brief__head {
  grid-column: 1 / 9;
  margin: 0;
  color: var(--head);
  font-family: var(--serif);
  font-size: clamp(40px, 5.6vw, 72px);
  font-weight: 400;
  line-height: 1.04;
  letter-spacing: -.02em;
  text-wrap: balance;
}

.brief__rule {
  grid-column: 1 / 13;
  width: 100%;
  height: 1px;
  margin: clamp(44px, 5vw, 72px) 0 clamp(36px, 4vw, 56px);
  border: 0;
  background: var(--hairline);
}

.brief__body {
  grid-column: 5 / 11;
}

.brief__body p {
  max-width: 55ch;
  margin: 0 0 clamp(32px, 3.5vw, 48px);
  color: var(--body);
  font-size: 18px;
  line-height: 1.6;
}

.brief__cta {
  display: inline-block;
  padding: 16px 32px;
  border-radius: 0;
  background: var(--accent);
  color: #11142b;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .01em;
  text-decoration: none;
  transition: background-color .18s ease;
}

.brief__cta:hover,
.brief__cta:focus-visible { background: var(--accent-hover); }

.brief__cta:focus-visible {
  outline: 2px solid var(--head);
  outline-offset: 3px;
}

@media (max-width: 1024px) {
  .brief__head { grid-column: 1 / 11; }
  .brief__body { grid-column: 3 / 12; }
}

@media (max-width: 768px) {
  .brief__grid { display: block; }
  .brief__head { font-size: clamp(34px, 8.5vw, 48px); }
  .brief__rule { margin: 36px 0 32px; }
  .brief__body p { font-size: 17px; }
  .brief__cta { display: block; text-align: center; }
}
</style>
</head>
<body>

<section class="brief" aria-labelledby="brief-heading">
  <div class="brief__grid">
    <h2 id="brief-heading" class="brief__head">Most searches go wrong at the brief. So we start there.</h2>
    <hr class="brief__rule">
    <div class="brief__body">
      <p>Before we search, we work with your team to define who the role actually needs. You see fewer profiles, each one assessed before it reaches you.</p>
      <a class="brief__cta" href="/contact">Start a search</a>
    </div>
  </div>
</section>

</body>
</html>
